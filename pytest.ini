[pytest]
# 临时措施：把 pytest 的临时目录和缓存都收进项目里这个文件夹。
#
# 起因：两处默认位置都被沙箱账号创建过，权限只给了它自己，导致你用普通权限运行时
# 报 WinError 5 拒绝访问：
#   1. 系统临时目录里的 pytest-of-dell
#   2. 仓库根目录下的 .pytest_cache
# 用管理员权限把那两个目录删掉之后，下面两行就可以去掉，恢复正常默认行为。
addopts = --basetemp=.pytest_runtime/tmp
cache_dir = .pytest_runtime/cache

# 把仓库根目录加入模块搜索路径。
# 不加这一条，测试里 `import check_env` 会因为找不到文件而报
# ModuleNotFoundError（用 pytest 命令运行时必现，用 python -m pytest 时侥幸能过）。
pythonpath = .

# 不指定路径时，只在这些目录里找测试，避免把临时脚本也当成测试跑。
testpaths = tests

# 测试函数命名规则（pytest 默认就是这样，写出来是为了让你知道去哪找）
python_files = test_*.py
python_functions = test_*
