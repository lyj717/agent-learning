[pytest]
# 这份配置是给 chat_cli 这个小项目自己用的。
#
# 为什么单独放一份：仓库根目录的 pytest.ini 里写的是 pythonpath = .，
# 那只能让测试 import 到仓库根目录下的模块；而我们的 llm.py 在
# weeks/week00_python/chat_cli/ 里。所以在这个目录里跑 pytest 时，
# 用它自己的配置把当前目录加进搜索路径。
#
# 跑法（要先 cd 到这个目录）：
#   cd weeks\week00_python\chat_cli
#   ..\..\..\.venv\Scripts\python.exe -m pytest -v

pythonpath = .
testpaths = tests
