<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Week07 最简页面</title>
    <style>
      body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
      #question { width: 320px; padding: 4px; }
      #answer { background: #f5f5f5; padding: 8px; min-height: 1.5em; }
      #elapsed { color: #666; }
    </style>
  </head>
  <body>
    <h1>离线问答</h1>
    <p>
      <input id="question" placeholder="例如：地点" />
      <button id="send">发送</button>
    </p>
    <p id="elapsed"></p>
    <pre id="answer"></pre>
    <ul id="citations"></ul>

    <script>
      async function ask() {
        const question = document.getElementById("question").value;
        const started = performance.now();

        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: "demo", question: question }),
        });
        const data = await response.json();
        const elapsed = performance.now() - started;

        const answer = document.getElementById("answer");
        const citations = document.getElementById("citations");
        const elapsedBox = document.getElementById("elapsed");
        citations.innerHTML = "";

        if (!response.ok) {
          answer.textContent = "请求失败：" + JSON.stringify(data.detail ?? data);
          elapsedBox.textContent = "";
          return;
        }

        answer.textContent = data.checked.answer;
        for (const id of data.checked.cited_ids) {
          const item = document.createElement("li");
          item.textContent = id;
          citations.appendChild(item);
        }
        elapsedBox.textContent = elapsed.toFixed(1) + " ms";
      }

      document.getElementById("send").addEventListener("click", ask);
    </script>
  </body>
</html>
